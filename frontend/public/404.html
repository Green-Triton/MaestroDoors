<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена — ООО СК «Пирс»</title>
    <!--
      GitHub Pages отдаёт этот файл на неизвестных путях. Сайт одностраничный,
      поэтому здесь достаточно вернуть посетителя на главную. Базовый путь
      берётся из адреса: /<repo>/что-угодно -> /<repo>/
    -->
    <script>
      var segments = location.pathname.split('/').filter(Boolean)
      var base = segments.length > 1 ? '/' + segments[0] + '/' : '/'
      location.replace(base)
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf8;
        color: #2b2a29;
        font-family: 'Jost', 'Segoe UI', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Страница не найдена. Возвращаемся в каталог…</p>
  </body>
</html>
