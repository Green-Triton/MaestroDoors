# nginx для сайта ООО СК «Пирс».
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pirs-catalog
#   sudo ln -s /etc/nginx/sites-available/pirs-catalog /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените ДОМЕН на свой (или на IP сервера, пока домена нет).
# HTTPS добавит certbot — он сам допишет этот файл, править вручную не нужно:
#   sudo certbot --nginx -d ДОМЕН -d www.ДОМЕН

server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН www.ДОМЕН;

    root /opt/pirs-catalog/frontend/dist;
    index index.html;

    # Заявка — несколько строк текста. Ограничение отсекает попытки залить мусор.
    client_max_body_size 64k;

    # Сжимаем текстовые ответы. WebP и другие картинки уже сжаты — их не трогаем,
    # повторное сжатие только тратит процессор.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Не выдаём версию nginx.
    server_tokens off;

    # Базовые защитные заголовки.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API ---------------------------------------------------------------
    # Единственное, что уходит в Node. Всё остальное nginx отдаёт сам.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Без этих двух заголовков приложение увидит вместо адреса клиента
        # адрес прокси, и ограничение частоты станет общим на всех сразу.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Статика -----------------------------------------------------------
    # Имена файлов в assets/ содержат хеш содержимого: меняется файл — меняется
    # имя, поэтому кешировать можно навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Картинки дверей имя не меняют, поэтому кеш короче.
    location /doors/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html кешировать нельзя: иначе браузер после обновления сайта
    # продолжит просить файлы старой сборки, которых уже нет.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Одностраничное приложение: любой неизвестный путь отдаём как главную.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
